# Kripto bot ayarları
# Yüzdeler "3" = %3 şeklinde yazılır.

# paper: sanal para (gerçek emir GÖNDERMEZ, gerçek fiyatları kullanır)
# live:  gerçek emir. Ayrıca komutta --canli bayrağı da gerekir.
mode: paper

exchange: btcturk
quote: TRY

# Bota ayrılan toplam bütçe (TL). Bot bunun üstüne asla çıkmaz.
total_budget: 50000

# Komisyon oranı (%, alış ve satış için ayrı ayrı). BtcTurk'teki kendi
# oranını buraya yaz; emin değilsen yüksek tutmak daha güvenli.
fee_pct: 0.2

# Ana döngü: fiyatlar kaç saniyede bir kontrol edilsin
poll_seconds: 60

# Coin seçimi
#   fixed: yalnız "coins" listesinde işlem yapar.
#   scan:  "coins" listesi HEP izlenir; bot ayrıca tüm TL paritelerini tarar,
#          kurallara uyanları puanlar ve kalan yerleri en iyilerle doldurur.
#          Komut: python -m bot scan  (hangi coinlerin neden seçildiğini gösterir)
coins: [BTC, ETH, SOL, XRP, ETC, TRUMP, GRAM, ATM, LAYER, SPK]

selection:
  mode: scan
  max_coins: 18              # izleme listesinin toplam büyüklüğü (coins dahil)
  rescan_hours: 24           # tarama kaç saatte bir yenilensin
  min_volume_try: 20000000   # 24 saatlik hacim en az 20 milyon TL
  max_spread_pct: 0.3        # alış-satış farkı en fazla %0,3
  min_age_days: 30           # en az 30 gündür listede
  min_volatility_pct: 1.5    # günlük ortalama hareket en az %1,5 (durgun coin kar getirmez)
  max_volatility_pct: 8      # en fazla %8 (aşırı oynak coin stop'a takılır)
  require_trend: true        # fiyat 50 günlük ortalamanın üstünde olmalı
  blacklist: [STX, APE, PEPE]   # asla işlem yapılmayacak coinler, ör. [PEPE, SHIB]

# Aynı anda en fazla kaç coinde pozisyon açık olsun.
#   auto: total_budget / (coin başı en fazla harcama) aşağı yuvarlanır; bütçe artınca kendiliğinden artar.
#   Elle sayı yazılırsa o kullanılır ama tüm kademeler dolunca bütçe aşılıyorsa bot başlamaz.
max_open_positions: 12

# Varsayılan strateji (her coin için geçerli; aşağıda coin bazında değiştirilebilir)
strategy:
  timeframe: 1h            # mum aralığı

  # --- Giriş ---
  rsi_period: 14
  rsi_below: 50            # RSI bu değerin altına inince ilk alım (null = RSI şartı yok)
  trend_ema: 200           # fiyat bu EMA'nın üstündeyse al (null = trend şartı yok)

  # --- Kademeli alım ---
  base_order: 800          # ilk alım (TL)
  safety_orders: 3         # en fazla kaç ek alım
  safety_order: 800        # ilk ek alım (TL)
  safety_volume_scale: 1.3 # her ek alım bir öncekinin kaç katı
  safety_step_pct: 4       # son alımdan bu kadar düşünce ek alım yap
  safety_step_scale: 1.0   # adımlar büyüsün mü (1.0 = hep aynı)

  # --- Çıkış ---
  take_profit_pct: 5       # komisyonlar DÜŞÜLDÜKTEN sonraki net kar hedefi
  trailing_pct: 1.0        # hedefe ulaşınca zirveden bu kadar düşerse sat (0 = hemen sat)
  stop_loss_pct: 12        # ortalama maliyetin bu kadar altında zararı kes (null = kapalı)

  # --- Bekleme ---
  cooldown_after_tp_min: 60
  cooldown_after_sl_min: 1440

# Coin bazında değişiklikler (yalnız değiştirmek istediğin alanları yaz).
# Tarama bu coinleri seçerse bu ayarlar kullanılır.
overrides:
  # Oynak coinlerde daha geniş adım ve stop
  TRUMP: { safety_step_pct: 6, stop_loss_pct: 18, take_profit_pct: 6 }
  LAYER: { safety_step_pct: 6, stop_loss_pct: 18, take_profit_pct: 6 }
  SPK:   { safety_step_pct: 6, stop_loss_pct: 18, take_profit_pct: 6 }
  ZRO:   { safety_step_pct: 5, stop_loss_pct: 15 }

# Çoklu zaman dilimi giriş filtresi: yalnız YENİ pozisyon açmayı (ilk alım) etkiler.
# Her kural ayrı açılıp kapatılır; hepsi false iken bot eskisi gibi davranır. Yalnız kapanmış mumlar kullanılır.
entry_filter:
  trend: true              # 1) 4 saatlik mumlarda EMA20 > EMA50
  confirm: true            # 2) 1 saatlik mumlarda fiyat > EMA50 ve RSI(14) < 50
  trigger: true            # 3) 15 dakikalık RSI(14) son 6 mumda 35 altına inmiş ve yukarı dönüyor
  # İnce ayar (varsayılanlar):
  # rsi_period: 14
  # trend_tf: 4h,  trend_fast_ema: 20, trend_slow_ema: 50
  # confirm_tf: 1h, confirm_ema: 50,  confirm_rsi_below: 50
  # trigger_tf: 15m, trigger_rsi_below: 35, trigger_lookback: 6

# Sert düşüş korumaları. Kar al, takip eden stop ve zarar durdur bunlardan HİÇ etkilenmez.
# Yüzdeler bütçeye oranlıdır; total_budget artınca sınırlar da büyür. null = kapalı.
protection:
  btc_regime: true               # 4) BTC 4s EMA50 altında ya da 24 saatte %4'ten fazla düştüyse "riskli": yeni pozisyon yok
  # regime_ema: 50
  # regime_drop_24h_pct: 4       # null = yalnız EMA şartı
  block_safety_when_risky: true  # 5) riskliyken ek alımlar da yapılmasın
  max_invested_pct: 50           # 6) açık pozisyonlara bağlı para bütçenin en fazla %'si (ör. 50)
  max_full_positions: 4          #    tüm ek alımlarını yapmış pozisyon sayısı en fazla (ör. 4)
  circuit_breaker_pct: 3         # 7) toplam K/Z son 24 saatte bütçenin bu %'sinden fazla düşerse (ör. 3)
  # circuit_window_hours: 24     #    24 saat hiç alım yapılmaz (açık pozisyonlar satılmaz), Telegram'a bildirilir
  # circuit_pause_hours: 24

# Emir ayarları (yalnız canlı modda)
orders:
  # Hemen dolması için limit emir fiyatı en iyi fiyattan bu kadar içeride verilir
  slippage_pct: 0.3
  # Emir bu kadar saniyede dolmazsa iptal edilir
  timeout_seconds: 30

# Telegram bildirimi: .env içine TELEGRAM_BOT_TOKEN ve TELEGRAM_CHAT_ID yaz
telegram: true
